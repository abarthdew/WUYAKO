# UI 미리보기용 임시 배포 (ABTHDW-57). 서버 없이 번들 콘텐츠로 동작하며 학습 기록은 서버에 저장되지 않는다.
# 끄기: 저장소 변수 PAGES_ENABLED를 false로 (Settings → Secrets and variables → Actions → Variables)
name: Pages 미리보기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # VITE_API_BASE 없음 → 번들 콘텐츠 + 브라우저 저장
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
